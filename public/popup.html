<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        --bg: #fff;
        --fg: #1f1f1f;
        --muted: #6b6b6b;
        --hover: #e8eaed;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #292a2d;
          --fg: #e8eaed;
          --muted: #9aa0a6;
          --hover: #3c4043;
        }
      }
      body {
        margin: 0;
        padding: 4px 0;
        min-width: 240px;
        max-width: 360px;
        background: var(--bg);
        color: var(--fg);
        font: 13px system-ui, sans-serif;
      }
      button {
        display: flex;
        align-items: center;
        gap: 8px;
        width: 100%;
        padding: 6px 12px;
        border: 0;
        background: none;
        color: inherit;
        font: inherit;
        text-align: left;
        cursor: pointer;
      }
      button:hover,
      button:focus-visible {
        background: var(--hover);
        outline: none;
      }
      .favicon {
        flex-shrink: 0;
        width: 16px;
        height: 16px;
      }
      .title {
        flex: 1;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      .count {
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <div id="windows" role="menu"></div>
    <script type="module" src="popup.js"></script>
  </body>
</html>
